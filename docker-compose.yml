# Spins up a local PostgreSQL database for development.
#
#   docker compose up -d        # start Postgres in the background
#   docker compose down         # stop it (data is kept in the named volume)
#   docker compose down -v      # stop it AND delete the data
#
# Then point the app at it:
#   export DATABASE_URL="postgres://expense:expense@localhost:5432/expenses?sslmode=disable"
#   go run .

services:
  db:
    image: postgres:17
    container_name: expense-db
    environment:
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: expense
      POSTGRES_DB: expenses
    ports:
      # Host port is configurable to avoid clashing with another local Postgres:
      #   DB_PORT=5433 docker compose up -d
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Mounting schema.sql here makes Postgres run it on first startup.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expenses"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
